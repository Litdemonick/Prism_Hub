plugins {
    id "com.android.application"
    // "kotlin-android" ya no va: lo aplica el propio plugin de Flutter
    // (Kotlin integrado). Ver la nota en settings.gradle.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '0.1.0'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def _storeFile = file(System.getenv("KEYSTORE") ?: keystoreProperties.getProperty("storeFile") ?: "keystore.jks")
def _storePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
def _keyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias")
def _keyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword")
// Only sign with the release keystore when it actually exists (CI / signed builds).
// Locally it isn't present, so debug/release fall back to the default debug keystore.
def hasReleaseKeystore = _storePassword != null && _storeFile.exists()

android {
    namespace "com.prismhub.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    // Java 17, igual que TODOS los plugins.
    //
    // El build.gradle de la raiz ya obliga a cada plugin a compilar en 17
    // ("Plugins declare mismatched targets which fails on JDK 21"), pero la app
    // se habia quedado en 8. O sea que el proyecto no coincidia consigo mismo, y
    // Java avisaba en cada compilacion: "source/target value 8 is obsolete and
    // will be removed in a future release".
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        // ── El aviso de "Google Play exige API 33 o superior" ────────────
        //
        // Es un ERROR fatal para el linter y tira abajo la compilación de
        // release. Empezó a aplicarlo al declarar la app para televisores:
        // con el intent-filter de leanback, lint la trata como una app
        // publicable en Play Store.
        //
        // PrismHub NO se publica en Play Store — se distribuye como APK
        // directo desde las versiones de GitHub — así que ese requisito no
        // aplica.
        //
        // Y el targetSdk no se puede subir: está clavado en 28 porque más
        // arriba el servidor de torrents no arranca (ver defaultConfig).
        // O sea que el aviso pide algo que romperia la app para cumplir una
        // regla de una tienda donde no estamos.
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.prismhub.app"
        minSdk flutter.minSdkVersion
        // Cannot be changed or bt-server will not start.
        targetSdk 28
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Nombre visible por defecto. El release lo usa tal cual; debug y
        // profile lo pisan mas abajo para poder distinguirlos en el telefono.
        //
        // OJO con el "+=": asignando con "=" se reemplaza el mapa ENTERO y se
        // pierde applicationName, que lo inyecta Flutter y lo usa el manifiesto
        // en android:name. Con "=" la compilacion de Android falla con
        // "requires a placeholder substitution but no value for
        // <applicationName> is provided" — pasó, y no se ve en Windows porque
        // esto solo lo toca Android.
        manifestPlaceholders += [appLabel: "PrismHub"]
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile _storeFile
                storePassword _storePassword
                keyAlias _keyAlias
                keyPassword _keyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            // Use the release keystore when present, otherwise the default debug
            // keystore so local `flutter build apk --release` still works.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        // Las compilaciones de prueba se instalan APARTE, con otro identificador
        // y otro nombre visible.
        //
        // Con el mismo applicationId para todo, probar un cambio en el telefono
        // REEMPLAZABA la version instalada: se perdia la app que estaba en uso
        // y, con ella, sus datos. Ahora conviven las dos y en el cajon de
        // aplicaciones se distinguen por el nombre.
        //
        // El sufijo solo existe en debug y profile: al compilar el release el
        // identificador vuelve a ser com.prismhub.app, asi que la actualizacion
        // desde el boton de la app y la firma no cambian en nada.
        // El nombre visible va por manifestPlaceholders y no por resValue: el
        // manifiesto trae el texto escrito directo, y crear un recurso app_name
        // ademas del literal choca al compilar.
        debug {
            // Default debug signing (~/.android/debug.keystore).
            applicationIdSuffix ".dev"
            manifestPlaceholders += [appLabel: "PrismHub dev"]
        }
        profile {
            applicationIdSuffix ".dev"
            manifestPlaceholders += [appLabel: "PrismHub dev"]
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // La biblioteca de Kotlin ya NO se declara aca. Con Kotlin integrado la
    // pone Flutter, en la version que corresponde a SU compilador.
    //
    // Clavarla a mano fue lo que rompio la compilacion al migrar: Flutter
    // compila con Kotlin 2.0.0 y aca se pedia la biblioteca 2.2.20, asi que el
    // compilador no podia leerla ("metadata 2.2.0, expected 2.0.0") y fallaba
    // hasta en MainActivity.kt, con errores que parecian del codigo nuestro
    // cuando en realidad era el desajuste de versiones.
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
// Migrado de la Variant API vieja (android.applicationVariants.all +
// com.android.build.OutputFile), que AGP saca del todo en algún momento y
// mientras tanto el IDE la marca en rojo aunque compile. La de acá es la
// que reemplaza: cada output pasa a tener su versionCode propio como
// Property, en vez de un versionCodeOverride suelto en el objeto viejo.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def filtroAbi = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }
            def abiVersionCode = filtroAbi != null ? project.ext.abiCodes.get(filtroAbi.identifier) : null
            if (abiVersionCode != null) {
                output.versionCode.set(flutterVersionCode.toInteger() * 10 + abiVersionCode)
            }
        }
    }
}
