pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    // El Kotlin Gradle Plugin ya NO se declara aca: lo aplica Flutter por su
    // cuenta (Kotlin integrado). Declararlo aparte avisa que va a romper la
    // compilacion en versiones futuras de Flutter.
    //
    // OJO: esto solo saca el aviso de NUESTRO proyecto. El otro aviso, el de
    // los 8 plugins que aplican KGP por su cuenta (device_info_plus, share_plus
    // y compania), no depende de nosotros: lo tienen que arreglar sus autores.
}

include ":app"
