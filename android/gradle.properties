org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M
android.useAndroidX=true
# Jetifier (legacy support-library rewriting) is unneeded: all deps are AndroidX.
# Keeping it on triggers a JetifyTransform on the Flutter engine jars that OOMs.
android.enableJetifier=false
# Cross-drive path issue on Windows (pub cache C:\ vs project T:\) corrupts Kotlin incremental caches
kotlin.incremental=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Esta bandera la vuelve a escribir Flutter solo en cada build si no
# encuentra la línea (ver DisableBuiltInKotlinMigration en flutter_tools) —
# pelearle sacándola no sirve, siempre gana ella. Tampoco importa dejarla en
# false: isBuiltInKotlinEnabled() de Flutter da false SIEMPRE con un AGP
# menor a 9.0.0 (el de acá es 8.11.1), así que este flag no hace nada hoy.
# La versión real de Kotlin del build se fuerza en android/settings.gradle
# (ver el comentario ahí — plugins de terceros la pineaban vieja).
android.builtInKotlin=false
