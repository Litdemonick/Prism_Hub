# This is a basic workflow to help you get started with Actions

name: Dev Build CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build-and-release-android:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Decode keystore
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get
      # 打包apk
      - name: Collect Apks
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}

      # 发布安装包
      - name: Upload Artifact - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          name: PrismHub-pr-${{ github.event.pull_request.number }}-armeabi-v7a.apk
      - name: Upload Artifact - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          name: PrismHub-pr-${{ github.event.pull_request.number }}-arm64-v8a.apk
      - name: Upload Artifact - x86
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-x86_64-release.apk"
          name: PrismHub-pr-${{ github.event.pull_request.number }}-x86_64.apk

  build-and-release-windows:
    # Fijado a windows-2022 (no windows-latest): confirmado en vivo que la
    # imagen nueva de windows-latest trae un MSVC que rompe la compilación
    # de flutter_inappwebview_windows (usa <experimental/coroutine>, ahora
    # error duro en vez de warning). release.yml ya estaba fijado así y por
    # eso no le pasa lo mismo.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version FIJA a proposito, no "la ultima stable".
          #
          # Sin fijarla, cada release se compilaba con lo que hubiera ese dia:
          # dos releases seguidas podian salir con Flutter distinto sin que
          # nadie lo decidiera, y lo que se probaba en la maquina no era lo que
          # se publicaba. Para una app cuyo boton de actualizar no puede fallar,
          # eso es demasiado suelto.
          #
          # Al subirla, actualizar tambien el Flutter local para que las dos
          # sigan iguales.
          flutter-version: '3.44.8'
      - name: Install project dependencies
        run: flutter pub get
      - name: Build artifacts
        run: flutter build windows --release
      - name: Rename Release Directory Name to PrismHub 
        run: |
          mv build/windows/x64/runner/Release build/windows/x64/runner/PrismHub
      # 发布安装包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          path: "build/windows/x64/runner/PrismHub"
          name: PrismHub-pr-${{ github.event.pull_request.number }}-windows.zip

  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        # apt-get update primero: sin esto el índice de paquetes del runner
        # puede quedar desactualizado contra el mirror real y tirar 404 en
        # dependencias transitivas (confirmado en vivo: libarchive-dev)
        # — mismo fix que ya tenía release.yml, acá faltaba.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libmpv-dev mpv
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Version FIJA a proposito, no "la ultima stable".
          #
          # Sin fijarla, cada release se compilaba con lo que hubiera ese dia:
          # dos releases seguidas podian salir con Flutter distinto sin que
          # nadie lo decidiera, y lo que se probaba en la maquina no era lo que
          # se publicaba. Para una app cuyo boton de actualizar no puede fallar,
          # eso es demasiado suelto.
          #
          # Al subirla, actualizar tambien el Flutter local para que las dos
          # sigan iguales.
          flutter-version: '3.44.8'
      - name: Install project dependencies
        run: flutter pub get
      - name: Build artifacts
        run: flutter build linux --release
      - name: Rename Release Directory Name to PrismHub 
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/PrismHub
      # 发布安装包
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          path: "build/linux/x64/release/PrismHub"
          name: PrismHub-pr-${{ github.event.pull_request.number }}-linux.zip
