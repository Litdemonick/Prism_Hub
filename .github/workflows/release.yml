name: Release CI

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup Android SDK 36
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - name: Decode keystore
        run: echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
      - run: flutter pub get
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            arch="${f#app-}"
            arch="${arch%-release.apk}"
            mv "$f" "PrismHub-${{ github.ref_name }}-android-$arch.apk"
          done
      - name: Release Android
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/app/outputs/flutter-apk/PrismHub-*.apk"
          allowUpdates: true
          generateReleaseNotes: true

  build-and-release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libmpv-dev mpv
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Ensure QuickJS library is in bundle
        run: |
          set -e
          BUNDLE_LIB="build/linux/x64/release/bundle/lib"
          mkdir -p "$BUNDLE_LIB"
          # flutter_js 0.8.x usa flutter_qjs_bundled_libraries (con qjs) en vez de
          # flutter_js_bundled_libraries, por lo que el .so no se copia al bundle
          # via PLUGIN_BUNDLED_LIBRARIES. El install() del CMake de flutter_js
          # tampoco es confiable en CI. Lo copiamos manualmente.
          SO_PATH=$(grep -A2 '"name": "flutter_js"' .dart_tool/package_config.json \
            | grep '"rootUri"' \
            | cut -d'"' -f4 \
            | sed 's|file://||')
          SO_SRC="${SO_PATH}/linux/shared/libquickjs_c_bridge_plugin.so"
          if [ -f "$SO_SRC" ]; then
            cp -v "$SO_SRC" "$BUNDLE_LIB/"
            echo "✅ libquickjs_c_bridge_plugin.so copiado al bundle"
          else
            echo "⚠️  No encontrado en $SO_SRC, buscando en pub cache..."
            SO_FALLBACK=$(find "$HOME/.pub-cache" -path "*/flutter_js-*/linux/shared/libquickjs_c_bridge_plugin.so" 2>/dev/null | head -1)
            if [ -n "$SO_FALLBACK" ]; then
              cp -v "$SO_FALLBACK" "$BUNDLE_LIB/"
              echo "✅ libquickjs_c_bridge_plugin.so copiado desde fallback"
            else
              echo "❌ libquickjs_c_bridge_plugin.so no encontrado — el bundle no funcionará"
              exit 1
            fi
          fi
          echo "Contenido final de lib/:"
          ls -la "$BUNDLE_LIB/"
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../PrismHub-${{ github.ref_name }}-linux-x64.tar.gz .
      - name: Release Linux
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "PrismHub-${{ github.ref_name }}-linux-x64.tar.gz"
          allowUpdates: true
          generateReleaseNotes: true

  build-and-release-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Build Installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          /DMyAppVersion="${{ github.ref_name }}"
          inno_setup.iss
      - name: Package zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PrismHub-${{ github.ref_name }}-windows-x64.zip"
      - name: Release Windows
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "Output/*.exe,PrismHub-${{ github.ref_name }}-windows-x64.zip"
          allowUpdates: true
          # generateReleaseNotes: agrega el "What's Changed" real (commits
          # desde el tag anterior) debajo del body fijo — confirmado en vivo
          # que sin esto, cada release repetía la MISMA descripción genérica
          # que la anterior, sin decir qué cambió de verdad.
          generateReleaseNotes: true
          body: |
            ## PrismHub ${{ github.ref_name }} — anime, manga y series, sin límites

            App multiplataforma (Windows · Linux · Android) para ver anime, leer manga y acceder a series/películas mediante un sistema de **extensiones JavaScript**. Cada fuente de contenido es un script que se instala o actualiza por separado, sin depender de una actualización de la app.

            ### 📦 Assets disponibles

            | Archivo | Plataforma | Descripción |
            |---------|-----------|------------|
            | `PrismHub-setup-${{ github.ref_name }}.exe` | Windows x64 | Instalador (recomendado) |
            | `PrismHub-${{ github.ref_name }}-windows-x64.zip` | Windows x64 | Versión portable (sin instalador) |
            | `PrismHub-${{ github.ref_name }}-linux-x64.tar.gz` | Linux x64 | Binario precompilado |
            | `PrismHub-${{ github.ref_name }}-android-arm64-v8a.apk` | Android | ARM64 (teléfonos modernos — **recomendado**) |
            | `PrismHub-${{ github.ref_name }}-android-armeabi-v7a.apk` | Android | ARM32 (teléfonos antiguos) |
            | `PrismHub-${{ github.ref_name }}-android-x86_64.apk` | Android | x86_64 (emuladores / tabletas x86) |

            ### 🧩 Novedades de ${{ github.ref_name }}

            #### 🎬 **Reproductor de video — estabilidad**
            - ✅ Reparado: la imagen no se veía (solo audio) al abrir un capítulo en algunos servidores
            - ✅ Reparado: cerrar el reproductor podía dejarlo abierto con los controles sin responder
            - ✅ Reparado: crash al tocar play/pausa/cambiar de servidor después de cerrar el reproductor
            - ✅ Reparado: reabrir un capítulo justo después de cerrarlo podía dejar la pantalla nueva sin responder (bug de identificador interno compartido entre sesiones)
            - ✅ Apagado del reproductor con límite de tiempo — nunca vuelve a colgar la apertura del siguiente capítulo

            #### 🎨 **Animaciones y transiciones (Windows/Linux)**
            - ✅ Todas las pantallas de escritorio ahora animan al navegar (antes no había ninguna transición — cambio instantáneo)
            - ✅ "Descubre tu próxima obsesión" en Home ahora hace crossfade entre portadas en vez de cambiar de golpe
            - ✅ Flechas de scroll en Home animadas también en escritorio (antes solo en móvil)

            #### 📋 **Historial**
            - ✅ Reparado: el botón de ocultar una tarjeta no refrescaba la vista en la sección Historial
            - ✅ Tarjetas ocultas muestran el logo de PrismHub a pantalla completa en vez de una caja oscura recortada
            - ✅ Capturas de video en las tarjetas (Continuar/Historial) ahora llenan la tarjeta correctamente en vez de verse achicadas con barras negras

            #### 📲 **Sistema de actualización**
            - ✅ Reparado (Android): si faltaba el permiso "instalar apps desconocidas", el mensaje que explica cómo habilitarlo se perdía detrás de un error técnico confuso — ahora se ve el mensaje correcto
            - ✅ Auditado de punta a punta en Windows, Linux y Android: nombres de assets, permisos y flujo de instalación verificados contra lo que publica este mismo pipeline

            #### 🎯 **Características anteriores**
            - 🎬 Reproductor con failover automático entre servidores
            - 📖 Lector de manga con modo paginado y modo cascada (webtoon)
            - 📋 Historial y favoritos con progreso guardado localmente
            - 🔄 Auto-actualización en Windows y Linux
            - 🔌 Repositorio de extensiones **prism+** preinstalado

            ### 🐧 Linux

            ```bash
            # Instalación automática (recomendada)
            curl -fsSL https://raw.githubusercontent.com/Litdemonick/Prism_Hub/main/install/install.sh | bash
            ```

            También disponible PKGBUILD para Arch/derivados en `install/PKGBUILD`.

            Proyecto **open source bajo AGPL-3.0**. Reportá bugs en [Issues](https://github.com/Litdemonick/Prism_Hub/issues).
