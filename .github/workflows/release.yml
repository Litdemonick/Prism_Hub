name: Release CI

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Setup Android SDK 36
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"
      - name: Decode keystore
        run: echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}
      - run: flutter pub get
      - name: Build APKs
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            arch="${f#app-}"
            arch="${arch%-release.apk}"
            mv "$f" "PrismHub-${{ github.ref_name }}-$arch.apk"
          done
      - name: Release Android
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "build/app/outputs/flutter-apk/PrismHub-*.apk"
          allowUpdates: true
          omitBody: true

  build-and-release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev mpv
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../PrismHub-${{ github.ref_name }}-linux-x64.tar.gz .
      - name: Release Linux
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "PrismHub-${{ github.ref_name }}-linux-x64.tar.gz"
          allowUpdates: true
          omitBody: true

  build-and-release-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Build Installer
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          /DMyAppVersion="${{ github.ref_name }}"
          inno_setup.iss
      - name: Package zip
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PrismHub-${{ github.ref_name }}-windows-x64.zip"
      - name: Release Windows
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "Output/*.exe,PrismHub-${{ github.ref_name }}-windows-x64.zip"
          allowUpdates: true
          # generateReleaseNotes: agrega el "What's Changed" real (commits
          # desde el tag anterior) debajo del body fijo — confirmado en vivo
          # que sin esto, cada release repetía la MISMA descripción genérica
          # que la anterior, sin decir qué cambió de verdad.
          generateReleaseNotes: true
          body: |
            ## PrismHub — anime, manga y series, sin límites

            App multiplataforma (Windows · Linux · Android) para ver anime, leer manga y acceder a series/películas mediante un sistema de **extensiones JavaScript**: cada fuente de contenido es un script que se instala o actualiza por separado, sin depender de una actualización de la app.

            ### 📦 Assets disponibles

            | Archivo | Plataforma | Descripción |
            |---------|-----------|------------|
            | `PrismHub-setup-${{ github.ref_name }}.exe` | Windows x64 | Instalador (recomendado) |
            | `PrismHub-${{ github.ref_name }}-windows-x64.zip` | Windows x64 | Versión portable (sin instalador) |
            | `PrismHub-${{ github.ref_name }}-linux-x64.tar.gz` | Linux x64 | Binario precompilado |
            | `PrismHub-${{ github.ref_name }}-arm64-v8a.apk` | Android | ARM64 (teléfonos modernos — **recomendado**) |
            | `PrismHub-${{ github.ref_name }}-armeabi-v7a.apk` | Android | ARM32 (teléfonos antiguos) |
            | `PrismHub-${{ github.ref_name }}-x86_64.apk` | Android | x86_64 (emuladores / tabletas x86) |

            ### Qué incluye
            - **Reproductor con failover automático**: si un servidor falla, cambia solo al siguiente sin cortar la reproducción.
            - **Lector de manga** con modo paginado y modo cascada (scroll vertical tipo webtoon).
            - **Historial y favoritos** unificados, con progreso por episodio/capítulo guardado localmente.
            - **Auto-actualización en Windows y Linux**: la app se avisa sola de nuevas versiones y se actualiza desde Ajustes, sin volver a descargar el instalador a mano.
            - Repositorio oficial de extensiones **prism+** preinstalado (en crecimiento).

            Proyecto **open source bajo AGPL-3.0**. Sigue en beta — reportá bugs en [Issues](https://github.com/Litdemonick/Prism_Hub/issues).
