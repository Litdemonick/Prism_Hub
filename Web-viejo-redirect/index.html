<title>PrismHub se mudó</title>
<!--
  El sitio se mudó de Litdemonick/Prism_Hub a Litdemonick/PrismHub (repo
  público nuevo, sin código). Este repo sigue existiendo, público, solo
  como puente de actualización para versiones viejas de la app — ver
  application.dart. Pero su web ya no tiene que mantenerse duplicada ni
  puede quedar diciendo cosas que dejaron de ser ciertas (código abierto,
  AGPL): con esto, cualquiera que entre al link viejo salta a la casa
  nueva. Sin build, sin dependencias: un archivo suelto le alcanza a un
  redirect.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #0d0d12; color: #ececf1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  a { color: #e0409a; }
</style>
</head>
<body>
  <p>PrismHub se mudó. Si no saltás solo, <a href="https://litdemonick.github.io/PrismHub/">entrá acá</a>.</p>
</body>
</html>
