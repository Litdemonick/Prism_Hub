name: prismhub
description: PrismHub - Anime, manga and novels streaming application
publish_to: "none"
# El numero despues del "+" es el build, y de el sale el versionCode de Android
# (android/app/build.gradle lo multiplica por 10 y le suma el codigo de ABI).
# Android decide si algo es una actualizacion mirando ESE numero, no el "1.0.11":
# tiene que subir en cada release o el instalador puede rechazar el APK.
# Hasta la 1.0.10 quedo clavado en +1, asi que las tres primeras versiones
# salieron con el mismo versionCode.
version: 1.0.87+77

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^6.1.3
  desktop_multi_window: ^0.2.0
  dio: ^5.3.2
  dio_cookie_manager: ^3.1.0+1
  easy_refresh: ^3.3.2+1
  fluent_ui: ^4.7.6
  flutter:
    sdk: flutter
  # Traducciones de los widgets NATIVOS de Flutter (selector de fecha, menús
  # de texto, etiquetas de accesibilidad). Sin esto salían siempre en inglés
  # por más que la app estuviera en español.
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.1.1+1
  flutter_code_editor: ^0.3.0
  flutter_highlight: ^0.7.0
  flutter_i18n: ^0.36.0
  flutter_js: ^0.8.0
  flutter_markdown: ^0.6.17+1
  get: ^4.6.5
  go_router: ^12.1.1
  highlight: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.8.1
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # Biometría / credencial del sistema para la Zona +18 (huella en Android,
  # Windows Hello en Windows). En Linux no hay implementación y se cae al PIN.
  local_auth: ^2.3.0
  package_info_plus: ^4.2.0
  palette_generator: ^0.3.3+2
  path: ^1.8.3
  path_provider: ^2.1.0
  file_picker: ^8.1.0
  screenshot: ^2.1.0
  scrollable_positioned_list: ^0.3.8
  tmdb_api: ^2.1.5
  url_launcher: ^6.1.5
  url_launcher_linux: 3.0.6
  window_manager: ^0.5.1
  # Ya venía instalada como dependencia de window_manager; se declara para
  # poder consultar el tamaño de la pantalla y acotar el mínimo de la ventana a
  # lo que de verdad entra (ver _minimoQueEntraEnLaPantalla en main.dart).
  # Se fija la MISMA versión que ya estaba bloqueada, para no mover nada más.
  screen_retriever: 0.2.2
  cookie_jar: ^4.0.8
  flutter_inappwebview: ^6.1.5
  flutter_windows_webview:
    git:
      url: https://github.com/MiaoMint/flutter_windows_webview
      ref: master
  webview_cookie_manager_plus: ^2.0.17
  html: ^0.15.4
  xpath_selector_html_parser: ^3.0.1
  device_info_plus: ^9.0.3
  android_intent_plus: ^4.0.2
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  # No se usa directamente: entra por audio_service -> flutter_cache_manager.
  #
  # Se fija por DEBAJO de la 2.4.0 a proposito. De ahi en adelante el paquete
  # se partio y el codigo de Android quedo en sqflite_android, que usa
  # constantes de Android 16 (VERSION_CODES.BAKLAVA) y metodos de Java 19
  # (Locale.of, Thread.threadId). Con eso el APK no compila:
  #
  #   error: cannot find symbol  Build.VERSION_CODES.BAKLAVA
  #   error: cannot find symbol  Locale.of(String,String,String)
  #
  # flutter_cache_manager pide ^2.3.3+1, asi que esta version le sirve igual.
  # Se puede soltar cuando el proyecto suba el Java de los modulos de plugin.
  sqflite: ">=2.3.3+1 <2.4.0"
  extended_image: ^8.2.0
  flutter_hls_parser: ^2.0.1
  image_gallery_saver_plus: ^5.0.0
  flutter_socks_proxy: ^0.0.3
  logging: ^1.2.0
  share_plus: ^7.2.1
  volume_controller: ^2.0.7
  screen_brightness: ^0.2.2+1
  auto_orientation: ^2.3.1
  # Mantiene la pantalla encendida SOLO mientras el video reproduce de
  # verdad (ver el `ever(isPlaying, ...)` en video_controller.dart). Ya
  # estaba resuelta como dependencia transitiva (algún otro paquete la
  # trae) — se declara directa porque ahora se llama a su API a mano.
  wakelock_plus: ^1.1.4
  ed25519_edwards: ^0.3.1
  # Proxy HTTP local. Se levanto para el casteo (que ya no existe), pero
  # sigue haciendo falta para la reproduccion normal: cuando una lista HLS
  # reparte sus pedacitos entre varios nodos y alguno esta caido o lento, el
  # relay los sirve esquivando el nodo malo. Ver lib/utils/cast_relay_server.dart
  # (el nombre quedo del casteo; lo que hace hoy no tiene nada que ver).
  shelf: ^1.4.2
  # Recorte/zoom de la captura del reproductor WebView (le sacamos la barra
  # de controles del sitio antes de guardarla como portada de "Continuar
  # viendo") — ver video_controller.dart. Antes solo estaba como
  # dev_dependency (la usaba flutter_launcher_icons en tiempo de build), pero
  # el código de la app en sí también la necesita en runtime.
  image: ^4.8.0
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.5
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  # assets/icon/icon_square.png — recorte de iconoapp2.png al contorno real
  # de la estrella (el original tenía mucho margen transparente alrededor,
  # así que a 16-32px en la barra de tareas se veía chica/perdida en vez de
  # llenar el ícono como el resto de las apps). Este recorte + padding
  # cuadrado hace que se note grande y clara a cualquier tamaño.
  image_path: "assets/icon/icon_square.png"
  # OJO: el .ico de Windows NO se genera desde acá. flutter_launcher_icons
  # solo mete UNA imagen (la de icon_size) en el .ico, y entonces la barra de
  # tareas — que dibuja a 24/32px — tiene que achicar esos 256px al vuelo con
  # un escalador malo, y el icono se ve pixelado. El .ico bueno, con las 10
  # resoluciones que Windows pide, lo arma tool/generate_windows_icon.ps1:
  #   powershell -ExecutionPolicy Bypass -STA -File tool\generate_windows_icon.ps1
  # Dejar esto en false para que no lo pise.
  windows:
    generate: false
    image_path: "assets/icon/icon_square.png"
    icon_size: 256
  # El banner de Android TV (320x180, el que se ve en el selector de apps del
  # launcher de TV) TAMPOCO sale de acá: flutter_launcher_icons no genera
  # banners, solo íconos. assets/icon/banner_tv.png es la fuente; la copia que
  # de verdad usa Android vive a mano en
  # android/app/src/main/res/drawable-xhdpi/banner_tv.png. Si se retoca el
  # banner, hay que actualizar los dos archivos — no hay ningún paso
  # automático que los sincronice.

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/icon/logo.png
    - assets/icon/logo_mark.png
    # El logo de la app tal cual, el que se ve en la pantalla de arranque.
    - assets/iconoapp2.png
    - assets/banner_cargando_launch.jpg
    - assets/banner_cargando_launch_vertical.jpg
    - assets/icon/anilist.jpg
    - assets/carddefaultoffline.png
    - assets/js/
