name: prismhub
description: PrismHub - Anime, manga and novels streaming application
publish_to: "none"
version: 1.0.9+1

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^6.1.3
  desktop_multi_window: ^0.2.0
  dio: ^5.3.2
  dio_cookie_manager: ^3.1.0+1
  easy_refresh: ^3.3.2+1
  fluent_ui: ^4.7.6
  flutter:
    sdk: flutter
  # Traducciones de los widgets NATIVOS de Flutter (selector de fecha, menús
  # de texto, etiquetas de accesibilidad). Sin esto salían siempre en inglés
  # por más que la app estuviera en español.
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.1.1+1
  flutter_code_editor: ^0.3.0
  flutter_highlight: ^0.7.0
  flutter_i18n: ^0.36.0
  flutter_js: ^0.8.0
  flutter_markdown: ^0.6.17+1
  get: ^4.6.5
  go_router: ^12.1.1
  highlight: ^0.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.8.1
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # Biometría / credencial del sistema para la Zona +18 (huella en Android,
  # Windows Hello en Windows). En Linux no hay implementación y se cae al PIN.
  local_auth: ^2.3.0
  package_info_plus: ^4.2.0
  palette_generator: ^0.3.3+2
  path: ^1.8.3
  path_provider: ^2.1.0
  file_picker: ^8.1.0
  screenshot: ^2.1.0
  scrollable_positioned_list: ^0.3.8
  tmdb_api: ^2.1.5
  url_launcher: ^6.1.5
  url_launcher_linux: 3.0.6
  window_manager: ^0.5.1
  cookie_jar: ^4.0.8
  flutter_inappwebview: ^6.1.5
  flutter_windows_webview:
    git:
      url: https://github.com/MiaoMint/flutter_windows_webview
      ref: master
  webview_cookie_manager_plus: ^2.0.17
  html: ^0.15.4
  xpath_selector_html_parser: ^3.0.1
  device_info_plus: ^9.0.3
  android_intent_plus: ^4.0.2
  crypto: ^3.0.3
  extended_image: ^8.2.0
  flutter_hls_parser: ^2.0.1
  image_gallery_saver_plus: ^5.0.0
  flutter_socks_proxy: ^0.0.3
  logging: ^1.2.0
  share_plus: ^7.2.1
  volume_controller: ^2.0.7
  screen_brightness: ^0.2.2+1
  auto_orientation: ^2.3.1
  dlna_dart: ^0.0.8
  ed25519_edwards: ^0.3.1
  # Proxy HTTP local — un DLNA/Chromecast pide la URL del stream por su
  # cuenta y no puede mandar el Referer/User-Agent que muchas fuentes de
  # anime exigen; ver lib/utils/cast_relay_server.dart.
  shelf: ^1.4.2
  # Recorte/zoom de la captura del reproductor WebView (le sacamos la barra
  # de controles del sitio antes de guardarla como portada de "Continuar
  # viendo") — ver video_controller.dart. Antes solo estaba como
  # dev_dependency (la usaba flutter_launcher_icons en tiempo de build), pero
  # el código de la app en sí también la necesita en runtime.
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.5
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  # assets/icon/icon_square.png — recorte de iconoapp2.png al contorno real
  # de la estrella (el original tenía mucho margen transparente alrededor,
  # así que a 16-32px en la barra de tareas se veía chica/perdida en vez de
  # llenar el ícono como el resto de las apps). Este recorte + padding
  # cuadrado hace que se note grande y clara a cualquier tamaño.
  image_path: "assets/icon/icon_square.png"
  # OJO: el .ico de Windows NO se genera desde acá. flutter_launcher_icons
  # solo mete UNA imagen (la de icon_size) en el .ico, y entonces la barra de
  # tareas — que dibuja a 24/32px — tiene que achicar esos 256px al vuelo con
  # un escalador malo, y el icono se ve pixelado. El .ico bueno, con las 10
  # resoluciones que Windows pide, lo arma tool/generate_windows_icon.ps1:
  #   powershell -ExecutionPolicy Bypass -STA -File tool\generate_windows_icon.ps1
  # Dejar esto en false para que no lo pise.
  windows:
    generate: false
    image_path: "assets/icon/icon_square.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/icon/logo.png
    - assets/icon/logo_mark.png
    - assets/icon/anilist.jpg
    - assets/carddefaultoffline.png
    - assets/js/